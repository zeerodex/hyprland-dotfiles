# keybindings 
 
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$TERM = kitty 

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, killactive,
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, U, pseudo, # dwindle
bind = $mainMod, V, togglefloating,
bind = , F11, fullscreen,

bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh p 
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh s
bind = $mainMod CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh o 
# bind = $mainMod, F1, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod, R, exec, ~/.config/rofi/launchers/type-4/launcher.sh 
bind = $mainMod, M, exec, ~/.config/rofi/powermenu/type-2/powermenu.sh 
bind = $mainMod, up, exec, ~/.config/hypr/scripts/cliphist.sh 
bind = $mainMod, P, exec, hyprctl dispatch pin 
# bind = $mainMod CTRL SHIFT, S, exec, ~/.config/hypr/scripts/sleep.sh off
# bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/sleep.sh on
bind = $mainMod ALT, D, exec, sleep 0.1; hyprctl dispatch dpms off 

# bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/go-dev.sh go-todo-tui

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Requires playerctl
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

bind = ,XF86HomePage, exec, thunar 

# bind = $mainMod, TAB, movecurrentworkspacetomonitor, HDMI-A-1
# bind = $mainMod SHIFT, TAB, movecurrentworkspacetomonitor, DVI-D-1

bind = $mainMod, Q, exec, $TERM 
bind = $mainMod, E, exec, thunar 
bind = $mainMod SHIFT, E, exec, [float] thunar
bind = $mainMod, W, exec, [workspace name:browser] zen-browser 
bind = $mainMod, Y, exec, $TERM yazi

bind = $mainMod, N, exec, kitty -e nvim
bind = $mainMod SHIFT, N, exec, kitty --directory=~/go/src/github.com/zeerodex/go-todo-tui/ -e nvim
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/terminals.sh
 
# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, u
bind = $mainMod, K, movefocus, d

# Resize windows
binde = $mainMod CTRL, L, resizeactive, 10 0
binde = $mainMod CTRL, H, resizeactive, -10 0
binde = $mainMod CTRL, J, resizeactive, 0 -10
binde = $mainMod CTRL, K, resizeactive, 0 10

# Move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, A, workspace, name:code
bind = $mainMod, G, workspace, name:games
bind = $mainMod, T, workspace, name:tg 
bind = $mainMod, Z, workspace, name:meeting
bind = $mainMod, F, workspace, name:browser
bind = $mainMod, D, workspace, name:documents
bind = $mainMod, X, workspace, name:notes

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, A, movetoworkspace, name:code
bind = $mainMod SHIFT, G, movetoworkspace, name:games
bind = $mainMod SHIFT, T, movetoworkspace, name:tg
bind = $mainMod SHIFT, Z, movetoworkspace, name:meeting
bind = $mainMod SHIFT, F, movetoworkspace, name:browser
bind = $mainMod SHIFT, D, movetoworkspace, name:documents
bind = $mainMod SHIFT, X, movetoworkspace, name:notes

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move window to workspace Super + Alt + [0-9]
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10
bind = $mainMod ALT, A, movetoworkspacesilent, name:code
bind = $mainMod ALT, G, movetoworkspacesilent, name:games 
bind = $mainMod ALT, T, movetoworkspacesilent, name:tg
bind = $mainMod ALT, Z, movetoworkspacesilent, name:meeting
bind = $mainMod ALT, F, movetoworkspacesilent, name:browser
bind = $mainMod ALT, D, movetoworkspacesilent, name:documents
bind = $mainMod ALT, X, movetoworkspacesilent, name:notes

# Special
bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod ALT, S, movetoworkspacesilent, special

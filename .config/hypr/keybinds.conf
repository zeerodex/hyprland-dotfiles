$mainMod = SUPER
$TERM = kitty
$SCRIPTS = ~/.config/hypr/scripts
$ROFI_LAUNCHER = ~/.config/rofi/launchers/type-4/launcher.sh
$ROFI_POWER = ~/.config/rofi/powermenu/type-2/powermenu.sh
$BROWSER = zen-browser
$FILE_MANAGER = thunar

# Window Management
bind = $mainMod, C, killactive,
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, U, pseudo, # dwindle
bind = $mainMod, V, togglefloating,
bind = , F11, fullscreen,
bind = $mainMod, P, exec, hyprctl dispatch pin

# Application Launching
bind = $mainMod, Q, exec, $TERM
bind = $mainMod, E, exec, $FILE_MANAGER
bind = $mainMod SHIFT, E, exec, [float] $FILE_MANAGER
bind = $mainMod, W, exec, [workspace name:browser] $BROWSER
bind = $mainMod, Y, exec, $TERM -e yazi
bind = $mainMod, N, exec, $TERM -e nvim
bind = $mainMod SHIFT, N, exec, $TERM --directory=~/go/src/github.com/zeerodex/go-todo-tui/ -e nvim

# Scripts
bind = , Print, exec, $SCRIPTS/screenshot.sh p
bind = $mainMod, Print, exec, $SCRIPTS/screenshot.sh s
bind = $mainMod CTRL, Print, exec, $SCRIPTS/screenshot.sh o
bind = $mainMod, R, exec, $ROFI_LAUNCHER
bind = $mainMod, M, exec, $ROFI_POWER
bind = $mainMod, up, exec, $SCRIPTS/cliphist.sh
bind = $mainMod ALT, D, exec, sleep 0.1; hyprctl dispatch dpms off
bind = $mainMod SHIFT, Q, exec, $SCRIPTS/terminals.sh

# Media Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Focus Navigation
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, u
bind = $mainMod, K, movefocus, d

# Window Resizing
binde = $mainMod CTRL, L, resizeactive, 10 0
binde = $mainMod CTRL, H, resizeactive, -10 0
binde = $mainMod CTRL, J, resizeactive, 0 -10
binde = $mainMod CTRL, K, resizeactive, 0 10

# Window Movement
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspace Switching (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace (1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch to Named Workspaces
bind = $mainMod, A, workspace, name:code
bind = $mainMod, G, workspace, name:games
bind = $mainMod, T, workspace, name:tg
bind = $mainMod, Z, workspace, name:meeting
bind = $mainMod, F, workspace, name:browser
bind = $mainMod, D, workspace, name:documents
bind = $mainMod, X, workspace, name:notes

# Move Window to Named Workspaces
bind = $mainMod SHIFT, A, movetoworkspace, name:code
bind = $mainMod SHIFT, G, movetoworkspace, name:games
bind = $mainMod SHIFT, T, movetoworkspace, name:tg
bind = $mainMod SHIFT, Z, movetoworkspace, name:meeting
bind = $mainMod SHIFT, F, movetoworkspace, name:browser
bind = $mainMod SHIFT, D, movetoworkspace, name:documents
bind = $mainMod SHIFT, X, movetoworkspace, name:notes

# Move Window to Workspace Silently
bind = $mainMod ALT, A, movetoworkspacesilent, name:code
bind = $mainMod ALT, G, movetoworkspacesilent, name:games
bind = $mainMod ALT, T, movetoworkspacesilent, name:tg
bind = $mainMod ALT, Z, movetoworkspacesilent, name:meeting
bind = $mainMod ALT, F, movetoworkspacesilent, name:browser
bind = $mainMod ALT, D, movetoworkspacesilent, name:documents
bind = $mainMod ALT, X, movetoworkspacesilent, name:notes
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# Special Workspace
bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod ALT, S, movetoworkspacesilent, special

# Workspace Scrolling
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, TAB, workspace, previous

# Mouse Bindings for Move/Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

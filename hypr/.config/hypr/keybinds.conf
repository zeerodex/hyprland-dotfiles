# ========================================
# VARIABLES
# ========================================
$mainMod = SUPER
$TERM = kitty
$SCRIPTS = ~/.config/hypr/scripts
$ROFI_LAUNCHER = ~/.config/rofi/launchers/type-4/launcher.sh
$ROFI_POWER = ~/.config/rofi/powermenu/type-2/powermenu.sh
$ROFI_EMOJI = rofi -modi emoji -show emoji -emoji-mode copy	-theme ~/.config/rofi/launchers/type-4/style-4.rasi
$FILE_MANAGER = thunar

# ========================================
# WINDOW MANAGEMENT
# ========================================
bind = $mainMod, Q, killactive
bind = $mainMod CTRL SHIFT, Q, forcekillactive
bind = $mainMod, O, togglesplit 
bind = $mainMod, U, pseudo 
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pin
bind = $mainMod, SPACE, centerwindow

# ========================================
# FOCUS NAVIGATION (VIM-STYLE)
# ========================================
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, V, exec, hyprctl dispatch focuswindow $(hyprctl activewindow -j | jq -r '.floating' | grep -q 'true' && echo 'tiled' || echo 'floating')

# ========================================
# WINDOW MOVEMENT (VIM-STYLE)
# ========================================
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ========================================
# WINDOW RESIZING (VIM-STYLE)
# ========================================
binde = $mainMod CTRL, H, resizeactive, -10 0
binde = $mainMod CTRL, L, resizeactive, 10 0
binde = $mainMod CTRL, K, resizeactive, 0 -10
binde = $mainMod CTRL, J, resizeactive, 0 10

# ========================================
# APPLICATIONS
# ========================================
# Terminal
bind = $mainMod, Return, exec, $TERM
bind = $mainMod SHIFT, Return, exec, [float; center; size 50% 60%] $TERM

# File Management
bind = $mainMod, E, exec, $FILE_MANAGER
bind = $mainMod SHIFT, E, exec, [float] $FILE_MANAGER
bind = $mainMod, Y, exec, EDITOR=nvim $TERM -e "yazi"

# Editors
bind = $mainMod, N, exec, [workspace name:code] $TERM -e nvim

bind = $mainMod, B, exec, qalculate-gtk
bind = $mainMod SHIFT, B, exec, [workspace special; tile] qalculate-gtk

# ========================================
# SCRIPTS & UTILITIES
# ========================================
# System
bind = $mainMod, F1, exec, $SCRIPTS/gamemode.sh
bind = $mainMod, D, exec, $ROFI_LAUNCHER
bindl = $mainMod, X, exec, $ROFI_POWER
bindl = $mainMod CTRL SHIFT, D, exec, sleep 1 && hyprctl dispatch dpms off; hyprlock
bindl = $mainMod SHIFT CTRL, Escape, exit

# Screenshots
bindl = , F12, exec, $SCRIPTS/screenshot.sh p
bind = $mainMod CTRL, S, exec, $SCRIPTS/screenshot.sh s
bind = $mainMod CTRL, F12, exec, $SCRIPTS/screenshot.sh o

# Clipboard History
bind = $mainMod, semicolon, exec, $SCRIPTS/cliphist.sh

# Emoji selector 
bind = $mainMod, T, exec, $ROFI_EMOJI

# ========================================
# MEDIA CONTROLS
# ========================================
# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = CTRL, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# ========================================
# WORKSPACES (NUMBERED 1-10)
# ========================================
# Switch to Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move Window to Workspace Silently
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# ========================================
# NAMED WORKSPACES
# ========================================
# Switch to Named Workspace
bind = $mainMod, C, workspace, name:code
bind = $mainMod, W, workspace, name:browser

# Move Window to Named Workspace
bind = $mainMod SHIFT, C, movetoworkspace, name:code
bind = $mainMod SHIFT, W, movetoworkspace, name:browser

# Move Window to Named Workspace Silently
bind = $mainMod ALT, C, movetoworkspacesilent, name:code
bind = $mainMod ALT, W, movetoworkspacesilent, name:browser

# ========================================
# SPECIAL WORKSPACES
# ========================================
# Default Special Workspace
bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod SHIFT, S, movetoworkspace, special
bind = $mainMod ALT, S, movetoworkspacesilent, special

# Named Special Workspaces (Scratchpads)
bind = $mainMod, Z, togglespecialworkspace, spotify
bind = $mainMod, A, togglespecialworkspace, comms
bind = $mainMod SHIFT, Z, movetoworkspace, special:spotify
bind = $mainMod SHIFT, A, movetoworkspace, special:comms

# ========================================
# WORKSPACE NAVIGATION
# ========================================
# Cycle Through Workspaces
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod, grave, workspace, previous 

# Mouse Wheel Workspace Switching
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# ========================================
# MOUSE BINDINGS
# ========================================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

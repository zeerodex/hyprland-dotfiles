# ============================================
# GLOBAL RULES
# ============================================
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = noanim, class:^(ueberzugpp.*)$

# ============================================
# SYSTEM UTILITIES
# ============================================
# Rofi
windowrulev2 = stayfocused, class:^(Rofi)$
windowrulev2 = center, class:^(Rofi)$
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = dimaround, class:^(Rofi)$
windowrulev2 = noborder, class:^(Rofi)$
windowrulev2 = rounding 12, class:^(Rofi)$

# Authentication dialogs
windowrulev2 = float, class:^(polkit-.*)$
windowrulev2 = center, class:^(polkit-.*)$
windowrulev2 = stayfocused, class:^(polkit-.*)$
windowrulev2 = size 30% 40%, class:^(polkit-.*)$
windowrulev2 = dimaround, class:^(polkit-.*)$
windowrulev2 = rounding 12, class:^(polkit-.*)$

# ============================================
# BROWSERS
# ============================================
# Zen Browser
windowrulev2 = workspace name:browser, class:^(zen-alpha|zen-beta|zen)$
windowrulev2 = opacity 1 override, class:^(zen-alpha|zen-beta|zen)$
windowrulev2 = bordersize 0, class:^(zen-alpha|zen-beta|zen)$

# Firefox
windowrulev2 = workspace name:browser, class:^(firefox|Firefox)$
windowrulev2 = opacity 1 override, class:^(firefox|Firefox)$

# Chromium-based browsers
windowrulev2 = workspace name:browser, class:^(chromium|Chromium|google-chrome|brave-browser)$
windowrulev2 = opacity 1 override, class:^(chromium|Chromium|google-chrome|brave-browser)$

# Picture-in-Picture - улучшенная позиция и поведение
windowrulev2 = float, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = move 74% 4%, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = pin, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = nodim, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = idleinhibit focus, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = opacity 1 override, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = noblur, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = rounding 8, title:^(Picture-in-Picture|Picture in picture)$

# Browser DevTools
windowrulev2 = float, title:^(DevTools|Developer Tools)$
windowrulev2 = size 80% 80%, title:^(DevTools|Developer Tools)$
windowrulev2 = center, title:^(DevTools|Developer Tools)$

# ============================================
# TERMINAL
# ============================================
windowrulev2 = opacity 1 override, class:^(kitty)$
windowrulev2 = opacity 1 override, class:^(Alacritty|alacritty)$
windowrulev2 = opacity 1 override, class:^(foot)$
windowrulev2 = opacity 1 override, class:^(wezterm)$

# Floating terminals
windowrulev2 = float, class:^(kitty)$, title:^(float)$
windowrulev2 = size 60% 60%, class:^(kitty)$, title:^(float)$
windowrulev2 = center, class:^(kitty)$, title:^(float)$

# ============================================
# FILE MANAGERS & DIALOGS
# ============================================
# Thunar and other file managers
windowrulev2 = float, class:^(thunar|Thunar|pcmanfm|PCManFM|nemo|Nemo|dolphin|org.kde.dolphin)$
windowrulev2 = size 70% 75%, class:^(thunar|Thunar|pcmanfm|PCManFM|nemo|Nemo|dolphin|org.kde.dolphin)$
windowrulev2 = center, class:^(thunar|Thunar|pcmanfm|PCManFM|nemo|Nemo|dolphin|org.kde.dolphin)$
windowrulev2 = rounding 12, class:^(thunar|Thunar|pcmanfm|PCManFM|nemo|Nemo|dolphin|org.kde.dolphin)$

# File operations progress dialogs
windowrulev2 = float, title:^(File Operations|File Operation|Progress|Copying|Moving|Deleting).*$
windowrulev2 = size 40% 30%, title:^(File Operations|File Operation|Progress|Copying|Moving|Deleting).*$
windowrulev2 = center, title:^(File Operations|File Operation|Progress|Copying|Moving|Deleting).*$

# File Picker Dialogs
windowrulev2 = float, title:^(Choose Files|Select Files|File Upload|Open File|Save File|Browse for file)$
windowrulev2 = size 65% 75%, title:^(Choose Files|Select Files|File Upload|Open File|Save File|Browse for file)$
windowrulev2 = center, title:^(Choose Files|Select Files|File Upload|Open File|Save File|Browse for file)$

# Generic Dialog Windows
windowrulev2 = float, title:^(Open|Save|Select|Choose|Upload|Download).*$
windowrulev2 = size 65% 70%, title:^(Open|Save|Select|Choose|Upload|Download).*$
windowrulev2 = center, title:^(Open|Save|Select|Choose|Upload|Download).*$

# Properties and Preferences dialogs
windowrulev2 = float, title:^.*(Properties|Preferences|Settings|Configuration).*$
windowrulev2 = center, title:^.*(Properties|Preferences|Settings|Configuration).*$
windowrulev2 = size 50% 60%, title:^.*(Properties|Preferences|Settings|Configuration).*$
windowrulev2 = rounding 12, title:^.*(Properties|Preferences|Settings|Configuration).*$

# ============================================
# MEDIA VIEWERS
# ============================================
# Image viewers
windowrulev2 = float, class:^(imv|feh|sxiv|nsxiv|eog|org.gnome.eog|gwenview|org.kde.gwenview)$
windowrulev2 = center, class:^(imv|feh|sxiv|nsxiv|eog|org.gnome.eog|gwenview|org.kde.gwenview)$
windowrulev2 = size 85% 85%, class:^(imv|feh|sxiv|nsxiv|eog|org.gnome.eog|gwenview|org.kde.gwenview)$
windowrulev2 = opacity 1 override, class:^(imv|feh|sxiv|nsxiv|eog|org.gnome.eog|gwenview|org.kde.gwenview)$
windowrulev2 = keepaspectratio, class:^(imv|feh|sxiv|nsxiv|eog|org.gnome.eog|gwenview|org.kde.gwenview)$

# MPV video player
windowrulev2 = float, class:^(mpv)$
windowrulev2 = center, class:^(mpv)$
windowrulev2 = size 85% 85%, class:^(mpv)$
windowrulev2 = opacity 1 override, class:^(mpv)$
windowrulev2 = idleinhibit focus, class:^(mpv)$
windowrulev2 = keepaspectratio, class:^(mpv)$
windowrulev2 = nodim, class:^(mpv)$
windowrulev2 = noinitialfocus, class:^(mpv)$, title:^(.*youtube.*)$
windowrulev2 = rounding 12, class:^(mpv)$

# VLC
windowrulev2 = float, class:^(vlc)$
windowrulev2 = center, class:^(vlc)$
windowrulev2 = size 85% 85%, class:^(vlc)$
windowrulev2 = opacity 1 override, class:^(vlc)$
windowrulev2 = idleinhibit focus, class:^(vlc)$

# Generic Media viewer
windowrulev2 = float, title:^(Media viewer)$
windowrulev2 = center, title:^(Media viewer)$
windowrulev2 = size 85% 85%, title:^(Media viewer)$
windowrulev2 = opacity 1 override, title:^(Media viewer)$

# ============================================
# VIDEO CONFERENCING
# ============================================
# Zoom
windowrulev2 = workspace 6 silent, class:^(zoom|us.zoom.Zoom)$
windowrulev2 = opacity 1 override, class:^(zoom|us.zoom.Zoom)$
windowrulev2 = idleinhibit focus, class:^(zoom|us.zoom.Zoom)$
windowrulev2 = nodim, class:^(zoom|us.zoom.Zoom)$
windowrulev2 = stayfocused, class:^(zoom|us.zoom.Zoom)$, title:^(zoom)$
windowrulev2 = float, class:^(zoom|us.zoom.Zoom)$, title:^(Settings|Participants|Chat|Breakout Rooms)$
windowrulev2 = size 50% 60%, class:^(zoom|us.zoom.Zoom)$, title:^(Settings|Participants|Chat)$
windowrulev2 = center, class:^(zoom|us.zoom.Zoom)$, title:^(Settings|Participants|Chat)$

# Microsoft Teams
windowrulev2 = workspace 6, class:^(teams|microsoft teams|teams-for-linux)$
windowrulev2 = opacity 1 override, class:^(teams|microsoft teams|teams-for-linux)$
windowrulev2 = idleinhibit focus, class:^(teams|microsoft teams|teams-for-linux)$
windowrulev2 = nodim, class:^(teams|microsoft teams|teams-for-linux)$

# Skype
windowrulev2 = workspace 6, class:^(skypeforlinux|Skype)$
windowrulev2 = opacity 1 override, class:^(skypeforlinux|Skype)$
windowrulev2 = idleinhibit focus, class:^(skypeforlinux|Skype)$

# Google Meet (browser window detection)
windowrulev2 = idleinhibit focus, title:^(.*Meet.*)$

# ============================================
# OFFICE & DOCUMENT APPLICATIONS
# ============================================
# PDF Viewers
#windowrulev2 = workspace 4, class:^(zathura|org.pwmt.zathura)$
windowrulev2 = workspace 4, class:^(evince|org.gnome.Evince)$
windowrulev2 = workspace 4, class:^(okular|org.kde.okular)$
windowrulev2 = opacity 1 override, class:^(zathura|org.pwmt.zathura|evince|org.gnome.Evince|okular|org.kde.okular)$

# LibreOffice
windowrulev2 = workspace 4, class:^(libreoffice.*|ONLYOFFICE)$
windowrulev2 = opacity 1 override, class:^(libreoffice.*|ONLYOFFICE)$

# LibreOffice splash screen
windowrulev2 = float, class:^(libreoffice.*)$, title:^(LibreOffice)$
windowrulev2 = center, class:^(libreoffice.*)$, title:^(LibreOffice)$
windowrulev2 = noblur, class:^(libreoffice.*)$, title:^(LibreOffice)$
windowrulev2 = noborder, class:^(libreoffice.*)$, title:^(LibreOffice)$

# OnlyOffice
windowrulev2 = workspace 4, class:^(DesktopEditors|onlyoffice-desktopeditors)$
windowrulev2 = opacity 1 override, class:^(DesktopEditors|onlyoffice-desktopeditors)$

# ============================================
# DEVELOPMENT
# ============================================
# VS Code
windowrulev2 = workspace name:code, class:^(code-oss|Code|code|VSCodium)$
windowrulev2 = opacity 1 override, class:^(code-oss|Code|code|VSCodium)$

# JetBrains IDEs
windowrulev2 = workspace name:code, class:^(jetbrains-.*)$
windowrulev2 = opacity 1 override, class:^(jetbrains-.*)$

# Splash screens for IDEs
windowrulev2 = float, class:^(jetbrains-.*)$, title:^(win.*)$
windowrulev2 = center, class:^(jetbrains-.*)$, title:^(win.*)$
windowrulev2 = noborder, class:^(jetbrains-.*)$, title:^(win.*)$
windowrulev2 = noanim, class:^(jetbrains-.*)$, title:^(win.*)$

# ============================================
# GAMING
# ============================================
# Steam
windowrulev2 = workspace 5, class:^(steam)$
windowrulev2 = float, class:^(steam)$, title:^(Steam - News|Friends List|Steam Settings|Screenshot Uploader)$
windowrulev2 = size 60% 70%, class:^(steam)$, title:^(Steam - News|Friends List|Steam Settings)$
windowrulev2 = center, class:^(steam)$, title:^(Steam - News|Friends List|Steam Settings)$

# Steam games
windowrulev2 = workspace 5, class:^(steam_app_.*)$
windowrulev2 = workspace 5, class:^(factorio)$
windowrulev2 = idleinhibit always, class:^(steam_app_.*)$
windowrulev2 = opacity 1 override, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = nodim, class:^(steam_app_.*)$

# Lutris
windowrulev2 = workspace 5, class:^(lutris)$
windowrulev2 = float, class:^(lutris)$, title:^(Lutris)$

# Lutris games
windowrulev2 = fullscreen, class:^(lutris)$, title:^(.* - Wine.*)$
windowrulev2 = workspace 5, class:^(lutris)$, title:^(.* - Wine.*)$
windowrulev2 = idleinhibit always, class:^(lutris)$, title:^(.* - Wine.*)$
windowrulev2 = immediate, class:^(lutris)$, title:^(.* - Wine.*)$

# Wine/Proton games
windowrulev2 = fullscreen, class:^(wine|explorer.exe|battle.net.exe)$
windowrulev2 = idleinhibit always, class:^(wine|explorer.exe|battle.net.exe)$

# Minecraft
windowrulev2 = fullscreen, class:^(Minecraft.*)$
windowrulev2 = workspace 5, class:^(Minecraft.*)$
windowrulev2 = idleinhibit always, class:^(Minecraft.*)$

# ============================================
# SCRATCHPADS
# ============================================
# Spotify - Toggle: hyprctl dispatch togglespecialworkspace spotify
windowrulev2 = workspace special:spotify silent, class:^(Spotify|spotify|ncspot)$
windowrulev2 = float, class:^(Spotify|spotify|ncspot)$
windowrulev2 = size 90% 85%, class:^(Spotify|spotify|ncspot)$
windowrulev2 = center, class:^(Spotify|spotify|ncspot)$
windowrulev2 = opacity 1 override, class:^(Spotify|spotify|ncspot)$
windowrulev2 = rounding 16, class:^(Spotify|spotify|ncspot)$

# Comms: Discord & Telegram - Toggle: hyprctl dispatch togglespecialworkspace comms
windowrulev2 = workspace special:comms silent, class:^(discord|vesktop|WebCord|org.telegram.desktop|signal|Signal)$
windowrulev2 = opacity 1 override, class:^(discord|vesktop|WebCord|org.telegram.desktop|signal|Signal)$

# ============================================
# NOTIFICATIONS & OVERLAYS
# ============================================
# Notification daemons
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = animation slide, notifications

# ============================================
# LAYERS AND EFFECTS
# ============================================
# Waybar
layerrule = blur, waybar
layerrule = ignorezero, waybar

# Rofi
layerrule = blur, rofi
layerrule = ignorezero, rofi
#layerrule = animation slide, rofi

# ============================================
# XWAYLAND
# ============================================
# Force xwayland windows to be opaque
windowrulev2 = opacity 1 override, xwayland:1

# ============================================
# MISCELLANEOUS
# ============================================
# Picture viewers from browsers
windowrulev2 = float, title:^(.*\.(jpg|jpeg|png|gif|webp|bmp).*)$
windowrulev2 = center, title:^(.*\.(jpg|jpeg|png|gif|webp|bmp).*)$
windowrulev2 = size 80% 80%, title:^(.*\.(jpg|jpeg|png|gif|webp|bmp).*)$

# Confirmation dialogs
windowrulev2 = float, title:^(Confirm|Warning|Error|Information)$
windowrulev2 = center, title:^(Confirm|Warning|Error|Information)$
windowrulev2 = size 35% 25%, title:^(Confirm|Warning|Error|Information)$
windowrulev2 = dimaround, title:^(Confirm|Warning|Error|Information)$
windowrulev2 = stayfocused, title:^(Confirm|Warning|Error|Information)$

# Pavucontrol (audio control)
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = size 50% 60%, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = center, class:^(pavucontrol|org.pulseaudio.pavucontrol)$

# Qalculate
windowrulev2 = float, class:^(qalculate-gtk)$
windowrulev2 = size 20% 60%, class:^(qalculate-gtk)$
windowrulev2 = center, class:^(qalculate-gtk)$

# Network Manager
windowrulev2 = float, class:^(nm-connection-editor|nm-applet)$
windowrulev2 = size 45% 55%, class:^(nm-connection-editor|nm-applet)$
windowrulev2 = center, class:^(nm-connection-editor|nm-applet)$

# Bluetooth Manager
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 45% 55%, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# Archive managers
windowrulev2 = float, class:^(org.gnome.FileRoller|file-roller|ark|org.kde.ark|xarchiver)$
windowrulev2 = size 60% 70%, class:^(org.gnome.FileRoller|file-roller|ark|org.kde.ark|xarchiver)$
windowrulev2 = center, class:^(org.gnome.FileRoller|file-roller|ark|org.kde.ark|xarchiver)$
